name: CI/CD Pipeline

# El evento que dispara la pipeline
on:
  push:
    branches:
      - main  # Se ejecuta solo cuando se sube código a la rama 'main'

jobs:
  build_and_test:
    # La imagen del sistema operativo donde se ejecutará
    runs-on: ubuntu-latest 

    # ... código anterior ...

    steps:
      # 1. Checkout: Descarga el código del repositorio
      - uses: actions/checkout@v4

      # 2. Setup Node.js: Configura el entorno de Node
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # 3. Install Dependencies
      - name: Install Dependencies
        run: npm install
        # working-directory: ./tesis  <-- Si ya corregiste la ruta a la raíz, quita esto

      # **NUEVO PASO: Corregir permisos de ejecución**
      - name: Fix Cypress Permissions
        run: chmod +x ./node_modules/.bin/cypress
        # working-directory: ./tesis  <-- Usa la misma working-directory que para npm install/test

      # 4. Run Tests
      - name: Run Tests
        run: npm test
        # working-directory: ./tesis  <-- Si ya corregiste la ruta a la raíz, quita esto