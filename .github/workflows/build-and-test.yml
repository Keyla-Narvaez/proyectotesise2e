name: CI/CD Pipeline
#keyla Narvaez
on:
  push:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./tesis

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Cache Cypress Binary
        uses: actions/cache@v4
        id: cache-cypress
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Dependencies
        run: npm ci

      - name: Install Microsoft Edge
        run: |
          sudo apt update
          sudo apt install -y wget apt-transport-https software-properties-common
          wget -q https://packages.microsoft.com/keys/microsoft.asc -O- | sudo apt-key add -
          sudo add-apt-repository "deb [arch=amd64] https://packages.microsoft.com/repos/edge stable main"
          sudo apt update
          sudo apt install -y microsoft-edge-stable
          microsoft-edge-stable --version

      - name: Install Missing Cypress Binary
        run: |
          chmod +x ./node_modules/.bin/cypress || true
          npx cypress install

      - name: Run Tests
        run: npx cypress run --browser edge
        #run: npx cypress run --headed --browser edge

      # ➡️ PASO ACTUALIZADO PARA SUBIR VIDEOS Y CAPTURAS DE PANTALLA
      - name: Upload Cypress Artifacts (Screenshots & Videos)
        # ⚠️ CAMBIO 1: Usar always() para subir el video aunque el test pase
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          # ⚠️ CAMBIO 2: Corregir la ruta para que sea relativa al working-directory (./tesis)
          path: |
            cypress/screenshots
            cypress/videos