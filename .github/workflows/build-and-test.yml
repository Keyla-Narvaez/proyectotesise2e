name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build_and_test:
    #Usamos un contenedor de Docker con Cypress para evitar problemas de permisos y binarios.
    container: 
      # Usamos una etiqueta oficial y funcional (Node 18 con navegadores).
      image: cypress/browsers:node-18.15.0-chrome-111-ff-111

    runs-on: ubuntu-latest # Necesario para iniciar el contenedor

    # Configuramos la carpeta base de trabajo para todos los pasos
    defaults:
      run:
        working-directory: ./tesis 
        
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      # 1. Instalar dependencias
      # El contenedor ya tiene Node, solo necesitamos ejecutar npm install
      - name: Install Dependencies
        run: npm install

      # 2. Ejecutar pruebas (El binario de Cypress ahora funciona dentro del contenedor)
      - name: Run Tests
        run: npm test