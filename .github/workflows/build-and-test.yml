name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build_and_test:
    # Usamos el runner estándar de GitHub Actions (Ubuntu)
    runs-on: ubuntu-latest 

    defaults:
      run:
        # 🚨 IMPORTANTE: Todos los comandos de npm/Cypress se ejecutan DENTRO de la subcarpeta 'tesis'
        working-directory: ./tesis 
        
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x' 

      # 2. Instalar dependencias
      # La variable de entorno fuerza a Cypress a descargar su binario (soluciona "binary is missing")
      - name: Install Dependencies
        run: npm install
        env:
          CYPRESS_INSTALL_BINARY: 1 

      # 3. Forzar permisos de ejecución
      # Esto es necesario en entornos Linux para que el binario de Cypress pueda ejecutarse (soluciona "Permission denied")
      - name: Fix Cypress Permissions
        run: chmod +x ./node_modules/.bin/cypress

      # 4. Ejecutar pruebas
      # Usamos 'npx npm test' para asegurar que se use el ejecutable correcto.
      - name: Run Tests
        run: npx npm test