name: CI/CD Pipeline

# Evento: Se activa cuando hay un 'push' a la rama 'main'
on:
  push:
    branches:
      - main

jobs:
  build_and_test:
    # Entorno de ejecución
    runs-on: ubuntu-latest 

    steps:
      # 1. Descargar el código
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x' # Puedes cambiar la versión según tu proyecto

      # 3. Instalar dependencias (busca package.json en ./tesis)
      - name: Install Dependencies
        run: npm install
        working-directory: ./tesis 

      # 4. Forzar la descarga del binario de Cypress (soluciona 'binary is missing')
      - name: Download Cypress Binary
        run: npx cypress install
        working-directory: ./tesis

      # 5. Corregir permisos de ejecución (soluciona 'Permission denied')
      - name: Fix Cypress Permissions
        run: chmod +x ./node_modules/.bin/cypress
        working-directory: ./tesis

      # 6. Ejecutar pruebas (npm test)
      - name: Run Tests
        run: npm test
        working-directory: ./tesis