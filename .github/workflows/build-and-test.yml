name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build_and_test:
    # Usamos un contenedor Docker de Cypress que ya tiene Node.js, Cypress, y permisos.
    container: 
      image: cypress/base:20 # Usamos una imagen que tiene Node 20 y permisos correctos

    runs-on: ubuntu-latest # Esto sigue siendo necesario para ejecutar el contenedor

    defaults:
      run:
        working-directory: ./tesis # Mantenemos esta ruta de trabajo
        
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      # Los pasos de 'setup-node' y 'Download Cypress Binary' ya no son necesarios
      # porque la imagen base ya los trae.

      # 1. Instalar dependencias
      - name: Install Dependencies
        run: npm install

      # 2. Ejecutar pruebas (El binario de Cypress ya es accesible y ejecutable)
      - name: Run Tests
        # Usamos el comando 'npm test' que ya tenías configurado
        run: npm test