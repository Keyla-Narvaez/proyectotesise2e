name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build_and_test:
    # 🚨 CAMBIAMOS LA IMAGEN POR UN TAG MÁS GENÉRICO 🚨
    container: 
      image: cypress/base:18 # ¡Etiqueta simple y estable!

    runs-on: ubuntu-latest 

    defaults:
      run:
        working-directory: ./tesis 
        
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      # 1. Instalar dependencias
      - name: Install Dependencies
        run: npm install

      # 2. Ejecutar pruebas
      - name: Run Tests
        run: npm test