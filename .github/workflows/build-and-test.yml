name: CI/CD Pipeline
#keyla Narvaez
on:
  push:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./tesis

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # --- PASO CLAVE: CONFIGURACIÓN DEL CACHÉ DE CYPRESS ---
      - name: Cache Cypress Binary
        uses: actions/cache@v4
        id: cache-cypress
        with:
          # Esta es la ruta donde Cypress guarda su binario.
          path: ~/.cache/Cypress
          # La clave se basa en el OS (runner.os) y el hash del lockfile (package-lock.json).
          # Esto asegura que la caché solo se use si las versiones de las dependencias no han cambiado.
          key: cypress-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      # NOTA: Este paso se movió después de la configuración del caché para que el hashFiles() funcione correctamente.
      - name: Install Dependencies
        run: npm ci

      # --- PASO CLAVE: INSTALAR BINARIO (CONDICIONAL) ---
      # SÓLO ejecuta la instalación de Cypress si el paso de caché NO encontró nada.
      # La variable `steps.cache-cypress.outputs.cache-hit` es 'true' si se encontró la caché.
      - name: Install Missing Cypress Binary (Conditional)
        if: steps.cache-cypress.outputs.cache-hit != 'true'
        run: npx cypress install

      # La instalación de Edge es la parte más lenta y no puede ser cacheada
      # de forma nativa por esta acción, por lo que sigue siendo necesaria.
      - name: Install Microsoft Edge
        run: |
          sudo apt update
          # ... (resto de tu código de instalación de Edge)
          sudo apt install -y wget apt-transport-https software-properties-common
          wget -q https://packages.microsoft.com/keys/microsoft.asc -O- | sudo apt-key add -
          sudo add-apt-repository "deb [arch=amd64] https://packages.microsoft.com/repos/edge stable main"
          sudo apt update
          sudo apt install -y microsoft-edge-stable
          microsoft-edge-stable --version

      - name: Run Tests
        run: npx cypress run --browser edge

      - name: Upload Cypress Artifacts (Screenshots & Videos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            tesis/cypress/screenshots
            tesis/cypress/videos