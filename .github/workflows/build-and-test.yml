name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest 

    defaults:
      run:
        # La ruta de trabajo para comandos npm/Cypress
        working-directory: ./tesis 
        
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # 2. Cache del Binario de Cypress (Recomendado)
      # Esto ayuda a acelerar las ejecuciones futuras.
      - name: Cache Cypress Binary
        uses: actions/cache@v4
        id: cache-cypress
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      
      # 3. Instalar dependencias
      - name: Install Dependencies
        run: npm install

      # 4. Instalar Binario de Cypress (Paso explícito para el binario faltante)
      - name: Install Missing Cypress Binary
        run: npx cypress install

      # 5. Aplicar Permisos (Soluciona el error 'Permission denied' en el binario)
      # Esto se ejecuta justo después de la instalación del binario.
      - name: Fix Cypress Permissions
        run: chmod +x ./node_modules/.bin/cypress

      # 6. Ejecutar pruebas
      - name: Run Tests
        run: npx npm test