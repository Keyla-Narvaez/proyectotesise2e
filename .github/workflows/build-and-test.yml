name: CI/CD Pipeline

# El evento que dispara la pipeline
on:
  push:
    branches:
      - main  # Se ejecuta solo cuando se sube código a la rama 'main'

jobs:
  build_and_test:
    # La imagen del sistema operativo donde se ejecutará
    runs-on: ubuntu-latest 

    # ... código anterior ...

    steps:
      # 1. Checkout: Descarga el código del repositorio
      - uses: actions/checkout@v4

      # 2. Setup Node.js: Configura el entorno de Node
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # 3. Install Dependencies: ¡Añade working-directory aquí!
      - name: Install Dependencies
        run: npm install
        working-directory: ./tesis  # <--- Cambia esto a la subcarpeta que contiene package.json
        
      # 4. Run Tests: ¡Y también aquí!
      - name: Run Tests
        run: npm test
        working-directory: ./tesis  # <--- Cambia esto también