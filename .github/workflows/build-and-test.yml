name: CI/CD Pipeline
# El evento que dispara la pipeline
on:
  push:
    branches:
      - main
jobs:
  build_and_test:
    runs-on: ubuntu-latest 
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # 3. Install Dependencies
      - name: Install Dependencies
        run: npm install
        working-directory: ./tesis  # <--- ¡IMPORTANTE!

      # **NUEVO PASO: Corregir permisos de ejecución**
      - name: Fix Cypress Permissions
        run: chmod +x ./node_modules/.bin/cypress
        working-directory: ./tesis  # <--- ¡IMPORTANTE!

      # 4. Run Tests
      - name: Run Tests
        run: npm test
        working-directory: ./tesis  # <--- ¡IMPORTANTE!