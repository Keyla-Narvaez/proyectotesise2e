name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest 

    defaults:
      run:
        working-directory: ./tesis 
        
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # 2. Cache del Binario de Cypress
      # Esto guarda y restaura el binario en ~/.cache/Cypress
      - name: Cache Cypress Binary
        uses: actions/cache@v4
        id: cache-cypress
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      
      # 3. Instalar dependencias (del proyecto)
      - name: Install Dependencies
        run: npm install
        # Eliminamos CYPRESS_INSTALL_BINARY para evitar conflictos,
        # ya que vamos a usar un paso de instalación dedicado.

      # 4. Instalar Binario de Cypress (¡PASO CLAVE!)
      # Este paso fuerza la descarga del binario que falta.
      - name: Install Missing Cypress Binary
        run: npx cypress install

      # 5. Forzar permisos de ejecución (para 'Permission denied')
      - name: Fix Cypress Permissions
        run: chmod +x ./node_modules/.bin/cypress

      # 6. Ejecutar pruebas
      - name: Run Tests
        run: npx npm test