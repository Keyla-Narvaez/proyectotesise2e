name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest 

    defaults:
      run:
        # La ruta de trabajo para comandos npm/Cypress
        working-directory: ./tesis 
        
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Configurar Node.js y Cache de NPM
      - name: Setup Node.js and npm Cache
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # 2. Cache del Binario de Cypress (¡Soluciona el error de "binary is missing"!)
      - name: Cache Cypress Binary
        uses: actions/cache@v4
        id: cache-cypress
        with:
          # Ruta donde Cypress guarda su binario
          path: ~/.cache/Cypress
          # La clave se basa en el sistema operativo y el package-lock para invalidar si Cypress cambia de versión
          key: cypress-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      
      # 3. Instalar dependencias
      - name: Install Dependencies
        run: npm install
        env:
          # Variable para forzar la descarga del binario de Cypress DURANTE npm install
          CYPRESS_INSTALL_BINARY: 1 

      # 4. Forzar permisos de ejecución (Soluciona el error 'Permission denied' que ya tuvimos)
      - name: Fix Cypress Permissions
        run: chmod +x ./node_modules/.bin/cypress

      # 5. Ejecutar pruebas
      - name: Run Tests
        run: npx npm test